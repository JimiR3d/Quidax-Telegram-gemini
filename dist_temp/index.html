        errDiv.innerText = "Error: " + msg + "\n" + (error && error.stack ? error.stack : "");
        document.body.appendChild(errDiv);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errDiv = document.createElement('div');
        errDiv.style = "position: fixed; z-index: 999999; top: 0; left: 0; right: 0; background: darkred; color: white; padding: 20px; font-family: monospace; white-space: pre-wrap;";
        errDiv.innerText = "Unhandled Promise Rejection: " + (event.reason && event.reason.stack ? event.reason.stack : event.reason);
        document.body.appendChild(errDiv);
      });
    </script>
