# Fly.io deployment configuration for PulseDesk.
# railway.toml is kept as a backup config — only ONE platform may run at a
# time, or two GramJS sessions will double-ingest every Telegram message.
#
# Critical single-instance constraints (GramJS opens one persistent Telegram
# session per process):
#   - deploy with `fly deploy --ha=false` so Fly creates exactly ONE machine
#   - auto_stop_machines = "off": Fly must never suspend the machine, or the
#     Telegram listener dies silently
#   - min_machines_running = 1: keep it awake 24/7
#   - strategy = "rolling": on redeploy the old machine is stopped before the
#     new one starts (brief downtime, but never two Telegram sessions at once;
#     startup AutoFetch back-fills the gap with its 2-hour lookback)

app = "quidax-pulsedesk"
primary_region = "lhr" # London — close to Supabase eu-west-1 and Telegram's EU data centers

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  PORT = "8080" # Fly does not inject PORT like Railway does; the server reads this
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "300s" # Telegram connect can take minutes on cold start (same 5-min allowance as Railway)

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb" # Node + GramJS + Express sits ~150-250MB; 256MB risks OOM kills
