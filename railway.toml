# Railway deployment configuration for PulseDesk.
#
# Build: compiles the React dashboard (Vite) and bundles the Express/GramJS
# server (esbuild) into dist/server.mjs.
# Start: runs the bundled server directly — the npm "start" script is not used
# because it contains a Windows-only "chcp" console command.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "node dist/server.mjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Must stay at 1: each replica would open its own GramJS Telegram session and
# ingest every message in duplicate.
numReplicas = 1
